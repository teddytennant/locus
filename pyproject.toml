[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locus"
version = "0.1.0"
description = "Localized Unembedding Steering (LocUS) in JAX"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
